[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mmw"
version = "0.1.7"
description = "CUMCM mathematical modeling workflow CLI"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0", "pydantic>=2.0", "pydantic-settings>=2.0",
  "typer>=0.9", "rich>=13.0", "jinja2>=3.0", "pyyaml>=6.0",
  "pandas>=2.0", "openpyxl>=3.1", "numpy>=2.0", "scipy>=1.13",
  "matplotlib>=3.8", "scikit-learn>=1.5", "sympy>=1.12", "cycler>=0.12",
  "pypdf>=6.0",
  "originpro==1.1.15; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.21,<7"]

[project.scripts]
mmw = "mmw.cli:main"

[tool.setuptools]
packages = [
  "mmw", "mmw.agents", "mmw.gui", "mmw.latex", "mmw.pipeline", "mmw.utils",
  "mmw.utils.resources", "mmw.utils.resources.scientific_chart_palette", "knowledge",
]

[tool.setuptools.package-data]
mmw = [
  "prompts/**/*.j2", "latex/templates/**/*", "gui/static/**/*",
  "utils/resources/scientific_chart_palette/NOTICE.txt",
  "utils/resources/scientific_chart_palette/references/palettes.json",
  "utils/resources/scientific_chart_palette/select_palette.pydata",
]

[tool.setuptools.exclude-package-data]
mmw = [
  "**/__pycache__/*", "**/*.pyc",
]
knowledge = ["hmml.json", "domains/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
