[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mmw"
version = "0.1.5"
description = "CUMCM mathematical modeling workflow CLI"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0", "pydantic>=2.0", "pydantic-settings>=2.0",
  "typer>=0.9", "rich>=13.0", "jinja2>=3.0", "pyyaml>=6.0",
  "pandas>=2.0", "openpyxl>=3.1", "numpy>=2.0", "scipy>=1.13",
  "matplotlib>=3.8", "scikit-learn>=1.5", "sympy>=1.12", "cycler>=0.12",
  "pypdf>=6.0",
  "originpro==1.1.15; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.21,<7"]

[project.scripts]
mmw = "mmw.cli:main"

[tool.setuptools.packages.find]
include = ["mmw*", "knowledge"]

[tool.setuptools.package-data]
mmw = ["prompts/**/*.j2", "latex/templates/**/*", "gui/static/**/*"]
knowledge = ["hmml.json", "domains/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
